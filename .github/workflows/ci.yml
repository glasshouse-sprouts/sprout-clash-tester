# CI: engine and TypeScript tests, typecheck, lint, the desktop payload
# tests, a secret scan and the licence check — on every push and PR.
#
# Not covered here (check by hand, say in the PR what you clicked):
# the desktop app's UI beyond the payload tests (layout, drag and drop
# from the OS, dialogs, the live desktop MCP server), packaged builds,
# and Windows.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # No test starts Electron; skip its ~100 MB binary download in npm ci.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The stated minimums (Node 20.19, Rust 1.89) on Linux,
          # the recommended Node on macOS.
          - os: ubuntu-latest
            node: "20.19"
          - os: macos-latest
            node: "22"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.89 (engine/Cargo.toml rust-version)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Engine — build
        working-directory: engine
        run: cargo build --release --locked

      - name: Engine — tests
        working-directory: engine
        run: cargo test --release --locked

      - name: Install
        run: npm ci

      - name: Build TypeScript packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (incl. end-to-end against the engine)
        run: npm test
        env:
          CLASH_BINARY: ${{ github.workspace }}/engine/target/release/clash

  desktop-payload:
    # The desktop screens that build their own payload: drive the real
    # controls, assert what reaches the main process (window.api).
    name: Desktop payload tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run packages/desktop/src/renderer/src/App.payload.test.tsx

  secrets-and-licences:
    name: Secret scan and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history

      - name: Secret scan (gitleaks 8.30.1)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$file"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $file\$" checksums.txt | sha256sum -c -
          tar -xzf "$file" gitleaks
          ./gitleaks git --redact --no-banner .

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Licences on the allowlist
        # Fails when a dependency's licence is unknown or not allowed.
        run: npm run licenses
